databases:
  # Free-tier PostgreSQL on Render — persists data across deploys.
  - name: health-screener-db
    databaseName: health_screener
    user: health_screener_user
    plan: free

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: health-screener-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.x
      # Injected automatically from the database block above.
      - key: DATABASE_URL
        fromDatabase:
          name: health-screener-db
          property: connectionString
      # Override this with a strong random secret in the Render dashboard.
      - key: SECRET_KEY
        generateValue: true
      # Restrict CORS to the deployed frontend URL in production.
      - key: CORS_ORIGINS
        value: '["https://health-screener-frontend.onrender.com"]'

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: health-screener-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: health-screener-api
          property: host
