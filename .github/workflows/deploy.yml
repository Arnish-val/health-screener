name: CI + Deploy to AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ═══════════════════════════════════════════════════════════════════════════════
# This workflow has 3 jobs:
#   1. frontend  — lint, test, and build the React/Vite app
#   2. backend   — install deps and run pytest
#   3. deploy    — SSH into EC2 and redeploy (only on push to main, after tests)
# ═══════════════════════════════════════════════════════════════════════════════

jobs:
  # ── Frontend Tests ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest

  # ── Deploy to EC2 ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [frontend, backend]  # Only deploy after both test suites pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "═══════════════════════════════════════════════════"
            echo "  Deploying HealthLens Backend"
            echo "  Commit: ${{ github.sha }}"
            echo "═══════════════════════════════════════════════════"

            APP_DIR="/home/ubuntu/health-screener"
            cd "$APP_DIR"

            # ── Pull latest code ───────────────────────────────
            echo "[1/5] Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            # ── Write production .env ──────────────────────────
            echo "[2/5] Writing environment config..."
            cat > backend/.env << 'ENVEOF'
            DATABASE_URL=sqlite:///./health_screener.db
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            DEBUG=false
            ENVEOF

            # ── Rebuild Docker image ───────────────────────────
            echo "[3/5] Building Docker image..."
            docker build -t health-screener-api -f backend/Dockerfile .

            # ── Restart container ──────────────────────────────
            echo "[4/5] Restarting backend..."
            docker stop health-screener-api 2>/dev/null || true
            docker rm health-screener-api 2>/dev/null || true
            docker run -d \
              --name health-screener-api \
              --restart always \
              --env-file backend/.env \
              -v "$APP_DIR/ml_pipeline/models:/ml_pipeline/models:ro" \
              -p 8000:8000 \
              health-screener-api

            # ── Health check ───────────────────────────────────
            echo "[5/5] Running health check..."
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "⚠️  Health check returned HTTP $HTTP_CODE"
              echo "  Container logs:"
              docker logs --tail 20 health-screener-api
              exit 1
            fi

            # ── Cleanup old Docker images ──────────────────────
            docker image prune -f

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  ✅ Deployment Complete"
            echo "═══════════════════════════════════════════════════"
