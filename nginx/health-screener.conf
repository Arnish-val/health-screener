# Nginx reverse proxy configuration for HealthLens API
# Location on EC2: /etc/nginx/sites-available/health-screener
#
# After setting up DuckDNS, replace the server_name with your subdomain
# and run: sudo certbot --nginx -d healthlens.duckdns.org

server {
    listen 80;
    server_name _;  # Replace with: healthlens.duckdns.org

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy to FastAPI Backend ─────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for ML inference (models run in <1s but be safe)
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Max body size for API requests (no large uploads needed)
        client_max_body_size 1m;
    }

    # ── Health Check (used by CI/CD deploy verification) ─────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
