# ── Rate Limiting Zones ──────────────────────────────────────────────────────
# Limits general API requests to 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Limits sensitive auth endpoints (login/register) to 1 request per second per IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;  # Replace with: healthlens-arnish.duckdns.org

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Strict Rate Limiting for Authentication ──────────────────────────────
    location ~* /(api/v1/)?auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy to FastAPI Backend ─────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for ML inference (models run in <1s but be safe)
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Max body size for API requests (allows large fMRI file uploads)
        client_max_body_size 150m;
    }

    # ── Health Check (used by CI/CD deploy verification) ─────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
